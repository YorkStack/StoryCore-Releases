name: Download statistics

on:
  schedule:
    - cron: '37 5 * * *'
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - README.md
      - scripts/update-download-stats.py
      - tests/test_download_stats.py
      - .github/workflows/download-stats.yml

permissions:
  contents: write

concurrency:
  group: download-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Test counting and README preservation
        run: python3 -m unittest discover -s tests -p 'test_download_stats.py'
      - name: Fetch public release download counts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update-download-stats.py
      - name: Commit changed figures
        run: |
          if git diff --quiet -- README.md; then
            echo 'No change in download figures.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'docs: refresh package download statistics'
          git pull --rebase origin main
          git push origin HEAD:main
